						<div class="post-date"><p>2026/08/11</p></div>

					<p>
						<p style="text-align: justify;">一卡通票證公司今（11）日召開臨時董事會宣布，代理董事長廖泰翔先生將於 2026 年 8 月 11 日卸任，會中推舉通過由高雄市政府秘書長榮退的郭添貴擔任董事長。</p>
						<p style="text-align: justify;">新任董事長郭添貴歷任交通部航港局局長、台灣港務公司總經理等要職，公職歷練完整。</p>
