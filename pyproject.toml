[project]
name = "offer-radar"
version = "0.1.0"
description = "台灣信用卡/電子支付優惠比較 RAG 系統——自然語言查「去好市多刷哪張卡最划算」"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-telegram-bot>=21.0",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
omit = ["tests/*"]
